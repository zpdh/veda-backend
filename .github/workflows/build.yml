name: Build

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://veda:veda@localhost:5432/veda
      REDIS_URL: redis://localhost:6379
      FRONTEND_URL: http://localhost:5173
      SHARED_SECRET: test-secret

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: veda
          POSTGRES_PASSWORD: veda
          POSTGRES_DB: veda
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U veda"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:8-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Migrations
        run: alembic upgrade head

      - name: Run Tests
        run: pytest
