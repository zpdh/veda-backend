services:
  postgres:
    image: postgres:18-alpine
    container_name: veda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: veda
      POSTGRES_PASSWORD: veda
      POSTGRES_DB: veda
    ports:
      - "5432:5432"
    volumes:
        - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veda"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  pg_data:
